
name: checkmate-2.3

services:
  client:
    image: checkuptime/uptime_client:2.3.1
    build:
      context: .
      dockerfile: docker/dev/client.Dockerfile
    environment:
      NODE_ENV: development
      VITE_APP_API_BASE_URL: "http://localhost:52345/api/v1"
      UPTIME_APP_CLIENT_HOST: "http://localhost"
    ports:
      - "5173:5173"
    volumes:
      - ./docker/dev/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - ./client:/app
    depends_on:
      - server
  server:
    image: checkuptime/uptime_server:2.3.1
    command: ["npm", "run", "dev"]
    build:
      context: .
      dockerfile: docker/dev/server.Dockerfile
    ports:
      - "52345:52345"
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./server:/app
    # - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:52345/api-docs/ || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
  mongodb:
    image: mongo:8.0.9
    volumes:
      - mongo_data:/data/db
    command: ["mongod", "--quiet", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30

volumes:
  mongo_data:

